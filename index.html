<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>함께 읽는 성경</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="함께 읽는 성경">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 조용하고 다정한 매일의 습관. 장식보다 여백.
   IDEA: 성경책 위쪽에 늘어뜨린 세 가닥 가름끈(리본 책갈피). 세 줄 읽기 = 세 가닥.
   PICTURE: 오늘 화면의 세 리본이 페이지 윗선에서 내려와 각 줄의 장을 붙잡는다.
   COLOUR+TYPE: 흰 종이, 먹색 글자, 가름끈 세 색(자주, 군청, 금빛). 글꼴은 본문과 화면 모두 Noto Sans KR 한 가지.
   LAYOUT: 휴대폰 한 손 기준 한 단(최대 560px). 날짜 → 세 리본 → 두 사람 진도. 아래 탭으로 오늘/읽기표. */
:root{color-scheme:light dark;
  --bg:light-dark(#ffffff,#16181d);--paper:light-dark(#ffffff,#1c1f25);
  --ink:light-dark(#1b1d22,#ece9e2);--soft:light-dark(#5d616b,#a4a7ae);--faint:light-dark(#8b8f98,#7c8089);
  --line:light-dark(#e4e2dd,#2d3038);--wash:light-dark(#f5f4f1,#22252c);
  --r1:light-dark(#8a1f35,#d9667c);--r2:light-dark(#24479a,#7d9cf0);--r3:light-dark(#a8781c,#e0b55a);
  --ok:light-dark(#1b1d22,#ece9e2);
  --ui:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --text:var(--ui)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--ui);overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--r2);outline-offset:2px;border-radius:6px}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;padding-top:env(safe-area-inset-top)}
.brand{font:700 17px/1 var(--text);letter-spacing:-.02em}
.who{font-size:14px;color:var(--soft);display:flex;gap:6px;align-items:center;min-height:44px;padding:0 4px}
.demo{background:var(--wash);font-size:13px;color:var(--soft)}
.demo .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;min-height:44px;flex-wrap:wrap;padding-block:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;background:var(--paper);min-height:34px}
main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
/* 날짜 머리 */
.head{padding:26px 0 18px}
.date{font:700 clamp(30px,8vw,38px)/1.15 var(--text);letter-spacing:-.03em;margin:0;text-wrap:balance}
.sub{color:var(--soft);margin:8px 0 0;font-size:15px;text-wrap:pretty;word-break:keep-all}
.nav{display:flex;gap:8px;margin-top:16px;align-items:center}
.nav button{min-width:44px;height:44px;border:1px solid var(--line);border-radius:12px;font-size:18px;display:grid;place-items:center}
.nav .today-btn{font-size:14px;padding:0 14px}
.nav .spacer{flex:1}
.dayno{font-size:14px;color:var(--faint);font-variant-numeric:tabular-nums}
/* 가름끈 */
.page{border-top:2px solid var(--ink);margin-top:4px}
.rib{position:relative;padding:18px 0 22px 34px;border-bottom:1px solid var(--line)}
.rib::before{content:"";position:absolute;left:4px;top:-2px;bottom:12px;width:14px;background:var(--c);
  clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 11px),0 100%)}
.rib .kind{font-size:13px;color:var(--soft);margin:0 0 6px}
.row{display:flex;align-items:center;flex-wrap:wrap;column-gap:10px}
.row+.row{margin-top:4px}
.open{flex:1 1 auto;text-align:left;min-height:48px;display:flex;align-items:center;font:700 21px/1.25 var(--text);letter-spacing:-.02em}
.open small{font:400 14px var(--ui);color:var(--faint);margin-left:10px}
.marks{display:flex;gap:6px;margin-left:auto}
.mark{min-height:44px;display:grid;place-items:center}
.mark span{height:34px;min-width:4.8em;padding:0 12px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:500;border:1.5px solid var(--line);color:var(--faint);white-space:nowrap;transition:background .2s,border-color .2s,color .2s}
.mark.on span::before{content:"✓";font-weight:700}
.mark span small{font-size:12px;font-weight:500;opacity:.9}
.mark.part span{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--paper))}
.mark.them.part span{border-style:solid}
.mark.on span{background:var(--c);border-color:var(--c);color:var(--paper)}
.mark.them{cursor:default}
.mark.them span{border-style:dashed}
.mark.them.on span{border-style:solid}
.legend{font-size:14px;color:var(--soft);padding:12px 0 0 34px;margin:0;word-break:keep-all}
/* 진도 */
.sec{padding:30px 0 8px}
.sec h2{font:700 20px/1.2 var(--text);margin:0 0 14px}
.person{padding:12px 0;border-top:1px solid var(--line)}
.person .line1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.person b{font-size:16px}
.num{font-variant-numeric:tabular-nums;color:var(--soft);font-size:14px;white-space:nowrap}
.bar{height:8px;background:var(--wash);border-radius:4px;margin-top:8px;overflow:hidden}
.bar>div{height:100%;background:var(--ink);border-radius:4px;transition:width .4s}
.note{font-size:14px;color:var(--soft);margin:6px 0 0}
.note.late{color:var(--r1)}
.together{font-size:15px;color:var(--soft);padding:12px 0;border-top:1px solid var(--line)}
/* 읽기표 */
.months{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:none;position:sticky;top:57px;background:var(--bg);z-index:4}
.months::-webkit-scrollbar{display:none}
.months button{flex:none;min-height:36px}
.months button.cur{border-color:var(--ink);font-weight:600}
.day{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 4px;border-top:1px solid var(--line);min-height:52px}
.day.is-today{background:var(--wash);border-radius:10px;border-top-color:transparent}
.day .dt{font-variant-numeric:tabular-nums;font-size:14px;color:var(--soft);white-space:nowrap}
.day .refs{font-size:15px;display:flex;flex-wrap:wrap;gap:2px 10px}
.day .refs span{white-space:nowrap}
.day .refs span::before{content:"";display:inline-block;width:6px;height:10px;background:var(--c);margin-right:5px;vertical-align:0;clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 100%)}
.dots{display:flex;gap:5px}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--faint)}
.dot.half{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%);border-color:var(--ink)}
.dot.full{background:var(--ink);border-color:var(--ink)}
.dot.late{border-color:var(--r1);border-width:2px}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--r1);color:#fff;font-size:12px;font-weight:600;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.mhead{display:flex;align-items:center;gap:10px;margin:6px 0 8px}
.mhead h1{flex:1;margin:0;font:700 26px/1.2 var(--text);letter-spacing:-.02em}
.mhead button{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;font-size:18px}
.mhead button:disabled,.nav button:disabled{opacity:.35;cursor:default}
.num.late{color:var(--r1)}
.primary.wide{width:100%;margin:4px 0 8px}
.cgroup{padding:14px 0 6px;border-top:1px solid var(--line)}
.cgroup:first-child{border-top:2px solid var(--ink)}
.cdate{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 2px;font-size:15px}
.cdate span{color:var(--r1);font-size:14px}
.crow{position:relative;padding-left:22px}
.crow::before{content:"";position:absolute;left:2px;top:10px;bottom:10px;width:9px;background:var(--c);clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 6px),0 100%)}
.crow .open{font-size:19px}
/* 아래 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tabs a{display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;height:60px;text-decoration:none;color:var(--faint);font-size:15px;font-weight:500}
.tabs a[aria-current=page]{color:var(--ink);font-weight:600;box-shadow:inset 0 2px 0 var(--ink)}
/* 본문 읽기 */
.reader{position:fixed;inset:0;z-index:10;background:var(--paper);display:none;flex-direction:column}
.reader.show{display:flex}
.rbar{border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.rbar .wrap{display:flex;align-items:center;gap:4px;height:56px}
.rbar h2{flex:1;margin:0;font:700 19px/1.2 var(--text);display:flex;align-items:center;gap:10px}
.rbar h2 i{width:10px;height:18px;background:var(--c);clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%);flex:none}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;font-size:15px;color:var(--soft)}
.rbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.verses{font-family:var(--text);font-size:var(--fs,18px);line-height:1.85;letter-spacing:-.01em;padding:22px 0 30px;word-break:keep-all;overflow-wrap:anywhere}
.verses p{margin:0 0 .5em;display:grid;grid-template-columns:1.5em minmax(0,1fr);gap:.45em}
.verses .n{text-align:right;font:500 .68em/1 var(--ui);color:var(--faint);padding-top:1.05em}
.verses .loading{display:block}
.verses .hint{display:block;font:400 13px/1.5 var(--ui);color:var(--faint);margin:0 0 14px}
.verses .v{cursor:pointer;border-radius:8px;margin-inline:-6px;padding:0 6px;transition:background .15s}
.verses .v.sel{background:color-mix(in srgb,var(--c) 14%,var(--paper))}
.verses .v.upto{box-shadow:0 2px 0 var(--c);border-radius:8px 8px 0 0;padding-bottom:.35em;margin-bottom:.9em}
.verses .v.upto::after{content:"여기까지 읽었어요";grid-column:2;font:500 12px/1 var(--ui);color:var(--c);padding-top:.5em}
.here-btn{height:46px;border-radius:14px;border:1.5px solid var(--c);color:var(--c);font-weight:600;font-size:16px;margin-bottom:8px;background:color-mix(in srgb,var(--c) 8%,var(--paper))}
.here-btn[hidden]{display:none}
.src{font-size:13px;color:var(--faint);padding:0 0 18px;line-height:1.6}
.src a{color:var(--soft)}
.rfoot{border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:var(--paper)}
.rfoot .wrap{display:flex;gap:10px;align-items:center}
.done{flex:1;height:54px;border-radius:14px;background:var(--ink);color:var(--paper);font-size:17px;font-weight:600}
.done.is-read{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.partner-note{font-size:13px;color:var(--soft);text-align:center;margin:0 0 8px}
/* 로그인 등 */
.center{min-height:80vh;display:grid;place-items:center;text-align:center;padding:40px 20px}
.center h1{font:700 32px/1.15 var(--text);margin:18px 0 10px}
.center p{color:var(--soft);margin:0 auto 22px;max-width:30em}
.primary{height:52px;padding:0 24px;border-radius:14px;background:var(--ink);color:var(--paper);font-weight:600;font-size:16px}
.ribbons-art{display:flex;gap:10px;justify-content:center;height:120px}
.ribbons-art i{width:18px;background:var(--c);clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 14px),0 100%)}
.ribbons-art i:nth-child(2){height:100px}.ribbons-art i:nth-child(3){height:84px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw;word-break:keep-all;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.loading{color:var(--faint);padding:40px 0;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><p class="loading">불러오는 중…</p></div>
<div class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="rtitle">
  <div class="rbar"><div class="wrap">
    <button class="icon" id="rclose" aria-label="닫기">✕</button>
    <h2 id="rtitle"></h2>
    <button class="icon" id="fsdown" aria-label="글자 작게">가-</button>
    <button class="icon" id="fsup" aria-label="글자 크게">가+</button>
  </div></div>
  <div class="rbody" id="rbody"><div class="wrap"><div class="verses" id="verses"></div><p class="src" id="src"></p></div></div>
  <div class="rfoot"><div class="wrap" style="flex-direction:column;align-items:stretch">
    <p class="partner-note" id="pnote"></p>
    <button class="here-btn" id="here" hidden></button>
    <button class="done" id="done"></button>
  </div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
